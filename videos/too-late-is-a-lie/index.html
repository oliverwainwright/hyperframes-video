<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
  :root { --bg:#0a0a0a; --fg:#ffffff; --dim:#a3a3b8; --accent:#6366f1; --accent-hi:#a5b4fc; --success:#22c55e; --amber:#f59e0b; --red:#ef4444; --panel:#111118; --line:#26263a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
  #root { position:relative; width:100%; height:100%; background:var(--bg); color:var(--fg); font-family:"Inter", sans-serif; }
  .mono { font-family:"JetBrains Mono", monospace; }
  .scene { position:absolute; inset:0; width:100%; height:100%; }
  .si { position:absolute; inset:0; }
  /* Safe zone: top 150, bottom 170, sides 60 -> 960 x 1600 */
  .safe { position:absolute; left:60px; top:150px; width:960px; height:1600px; }
  .glow { position:absolute; width:1100px; height:1100px; left:-10px; top:380px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,0.22) 0%, rgba(99,102,241,0) 65%); }
  .ab { position:absolute; }
  .eyebrow { position:absolute; left:0; top:0; width:960px; display:flex; justify-content:center; }
  .eyebrow span { padding:8px 24px; border-radius:999px; border:3px solid var(--accent); background:rgba(99,102,241,0.16); color:var(--accent-hi); font-size:30px; font-weight:700; letter-spacing:3px; }
  .headline { position:absolute; left:0; top:70px; width:960px; text-align:center; font-weight:900; font-size:80px; line-height:1.04; letter-spacing:-2.5px; }
  .headline .l { display:block; white-space:nowrap; }
  .headline .a { color:var(--accent); }
  .body { position:absolute; left:40px; width:880px; text-align:center; font-size:42px; color:var(--dim); line-height:1.3; }
  .body b { color:#fff; font-weight:800; }
  .draw { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; }
  .pill { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:999px; font-weight:700; }
  .box { position:absolute; display:flex; align-items:center; border-radius:26px; background:var(--panel); border:4px solid var(--line); }
  .particle { position:absolute; border-radius:50%; }
  .shot-wrap { position:absolute; left:260px; top:160px; width:440px; height:440px; }
  .shot { position:absolute; left:30px; top:30px; width:380px; height:380px; border-radius:50%; overflow:hidden; border:5px solid var(--accent); box-shadow:0 30px 80px rgba(99,102,241,0.4), 0 0 0 10px var(--bg); }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { font-variant-numeric:tabular-nums; }
  .stamp { position:absolute; padding:10px 26px; border:7px solid #8a8aa0; border-radius:14px; color:#8a8aa0; font-family:"JetBrains Mono", monospace; font-weight:700; font-size:54px; letter-spacing:6px; }
</style>
  </head>
  <body>
    <div data-hf-id="hf-coex" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div data-hf-id="hf-u0u2" id="s1" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div data-hf-id="hf-f5um" class="si" id="s1-in"><div data-hf-id="hf-fssp" class="glow" id="s1-glow"></div><div data-hf-id="hf-oqr1" class="safe" id="s1-safe"></div></div>
      </div>
      <div data-hf-id="hf-15m9" id="s2" class="scene clip" data-start="5.6" data-duration="6.8" data-track-index="1">
        <div data-hf-id="hf-686n" class="si" id="s2-in"><div data-hf-id="hf-c6p0" class="glow" id="s2-glow"></div><div data-hf-id="hf-y250" class="safe" id="s2-safe"></div></div>
      </div>
      <div data-hf-id="hf-zmmd" id="s3" class="scene clip" data-start="12" data-duration="7.3" data-track-index="2">
        <div data-hf-id="hf-4w4k" class="si" id="s3-in"><div data-hf-id="hf-2wxn" class="glow" id="s3-glow"></div><div data-hf-id="hf-b4nv" class="safe" id="s3-safe"></div></div>
      </div>
      <div data-hf-id="hf-wqpn" id="s4" class="scene clip" data-start="18.9" data-duration="5.8" data-track-index="3">
        <div data-hf-id="hf-imz1" class="si" id="s4-in"><div data-hf-id="hf-fgfi" class="glow" id="s4-glow"></div><div data-hf-id="hf-k4oa" class="safe" id="s4-safe"></div></div>
      </div>
      <div data-hf-id="hf-jy65" id="s5" class="scene clip" data-start="24.3" data-duration="5.7" data-track-index="4">
        <div data-hf-id="hf-ssje" class="si" id="s5-in"><div data-hf-id="hf-ltbp" class="glow" id="s5-glow"></div><div data-hf-id="hf-x682" id="particles"></div><div data-hf-id="hf-dl5d" class="safe" id="s5-safe"></div></div>
      </div>
      <audio data-hf-id="hf-4u5e" id="bgm" src="technological-progress.mp3" data-start="0" data-duration="30" data-track-index="9" data-volume="0.35" data-fade-in="0.4" data-fade-out="0.6"></audio>
    </div>
    <script>
const tl = gsap.timeline({ paused: true });
const S = [0, 5.6, 12, 18.9, 24.3];
const LEN = [6, 6.8, 7.3, 5.8, 5.7];
const XF = 0.4;
const E = "power3.out";
const SVGNS = "http://www.w3.org/2000/svg";
const rise = (sel, at, y = 40, d = 0.6) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: E }, at);
const pop = (sel, at, from = 0.6) => tl.fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, at);
const drawIn = (sel, at, d = 0.6, stagger = 0) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out", stagger }, at);

let uid = 0;
const el = (parent, tag, cls, css = {}, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  n.id = "e" + ++uid;
  Object.assign(n.style, css);
  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
};
const svgEl = (parent, tag, attrs) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (!n.id) n.id = "e" + ++uid;
  parent.appendChild(n);
  return n;
};
const svgBox = (parent, x, y, w, h) => {
  const s = svgEl(parent, "svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h });
  Object.assign(s.style, { position: "absolute", left: x + "px", top: y + "px", overflow: "visible" });
  return s;
};
const px = (v) => v + "px";
const $ = (n) => "#" + n.id;
const fmt = (v) => Math.round(v).toLocaleString("en-US");
const safe = (i) => document.getElementById("s" + i + "-safe");

const eyebrow = (sf, text, t, now) => {
  const e = el(sf, "div", "eyebrow");
  el(e, "span", "mono", {}, text);
  if (!now) rise($(e), t + 0.2, 16, 0.4);
};
const headline = (sf, lines, t, css = {}, now) => {
  const h = el(sf, "div", "headline", css);
  el(h, "span", "l", {}, lines[0]);
  el(h, "span", "l a", {}, lines[1]);
  if (now) tl.fromTo($(h), { scale: 1.06 }, { scale: 1, duration: 1.2, ease: E }, t);
  else rise($(h), t + 0.3);
  return h;
};
const bodyText = (sf, html, top, t) => {
  const b = el(sf, "div", "body", { top: px(top) });
  b.innerHTML = html;
  rise($(b), t, 20);
};

// Crossfades + glow breath
for (let i = 1; i < 5; i++) {
  tl.to("#s" + i + "-in", { opacity: 0, duration: XF, ease: "power2.inOut" }, S[i]);
  tl.fromTo("#s" + (i + 1) + "-in", { opacity: 0 }, { opacity: 1, duration: XF, ease: "power2.inOut" }, S[i]);
}
for (let i = 1; i <= 5; i++) {
  tl.fromTo("#s" + i + "-glow", { scale: 0.92 }, { scale: 1.08, duration: LEN[i - 1] / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, S[i - 1]);
}

const allow = (n) => [n, ...n.querySelectorAll("*")].forEach((m) => { m.setAttribute("data-layout-allow-overlap", ""); m.setAttribute("data-layout-allow-occlusion", ""); });
const label = (sf, x, y, w, text, color, at) => {
  const l = el(sf, "div", "ab mono", { left: px(x), top: px(y), width: px(w), textAlign: "center", fontSize: "30px", fontWeight: 700, color, letterSpacing: "3px" }, text);
  rise($(l), at, 12, 0.4);
  return l;
};

// ---------------- Scene 1: hook (on screen from frame 0) ----------------
{
  const t = S[0], sf = safe(1);
  eyebrow(sf, "THE UNRETIRED EARNER", t, true);
  headline(sf, ["Priced out at 67.", "Started over anyway."], t, { fontSize: "76px" }, true);
  [["67", "KAREN", 210], ["69", "JEFF", 570]].forEach(([age, name, x], i) => {
    const b = el(sf, "div", "pill num", { left: px(x), top: "290px", width: "180px", height: "180px", background: "#111118", border: "6px solid #6366f1", color: "#ffffff", fontSize: "84px", fontWeight: 900 }, age);
    pop($(b), t + 0.3 + i * 0.3);
    label(sf, x - 40, 485, 260, name, "#a5b4fc", t + 0.5 + i * 0.3);
  });
  const card = el(sf, "div", "box", { left: "40px", top: "570px", width: "880px", height: "150px", padding: "0 44px", justifyContent: "space-between" });
  el(card, "div", "", { fontSize: "44px", fontWeight: 800 }, "U.S. rent");
  el(card, "div", "mono", { fontSize: "34px", fontWeight: 700, color: "#a3a3b8" }, "KEEPS RISING");
  allow(card);
  rise($(card), t + 1.0, 30, 0.5);
  const st = el(sf, "div", "stamp", { left: "250px", top: "585px", fontSize: "60px", borderColor: "#ef4444", color: "#ef4444", background: "#140b0d" }, "PRICED OUT");
  allow(st);
  tl.fromTo($(st), { opacity: 0, scale: 2.2, rotation: -7 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t + 1.7);
  tl.to($(card), { opacity: 0.35, duration: 0.3, ease: "power2.out" }, t + 2.0);
  // migration arc U.S. -> Mexico
  const m = svgBox(sf, 0, 780, 960, 220);
  const arc = svgEl(m, "path", { d: "M 160 190 Q 480 -40 800 190", stroke: "#a5b4fc", "stroke-width": 7, pathLength: 1, class: "draw" });
  drawIn($(arc), t + 2.5, 0.9);
  const pin1 = svgEl(m, "circle", { cx: 160, cy: 190, r: 18, fill: "#a3a3b8" });
  const pin2 = svgEl(m, "circle", { cx: 800, cy: 190, r: 22, fill: "#22c55e" });
  pop($(pin1), t + 2.4, 0.2); pop($(pin2), t + 3.3, 0.2);
  label(sf, 40, 1000, 240, "U.S.", "#a3a3b8", t + 2.4);
  label(sf, 650, 1000, 300, "MEXICO", "#22c55e", t + 3.3);
  const house = el(sf, "div", "box", { left: "140px", top: "1090px", width: "680px", height: "190px", gap: "40px", padding: "0 50px", borderColor: "#22c55e", background: "rgba(34,197,94,0.10)" });
  const hi = el(house, "div", "", { flex: "none", width: "110px", height: "110px", position: "relative" });
  const hs = svgBox(hi, 0, 0, 110, 110);
  const hp = svgEl(hs, "path", { d: "M 10 52 L 55 12 L 100 52 M 22 42 L 22 100 L 88 100 L 88 42 M 45 100 L 45 70 L 65 70 L 65 100", stroke: "#22c55e", "stroke-width": 7, pathLength: 1, class: "draw" });
  const hc = el(house, "div", "", { display: "flex", alignItems: "baseline", gap: "10px" });
  el(hc, "div", "num", { fontSize: "96px", fontWeight: 900, color: "#22c55e", letterSpacing: "-2px" }, "$1,250");
  el(hc, "div", "", { fontSize: "40px", fontWeight: 700, color: "#a3a3b8" }, "/mo");
  pop($(house), t + 3.7, 0.8);
  drawIn($(hp), t + 3.9, 0.7);
}

// ---------------- Scene 2: learned AI late ----------------
{
  const t = S[1], sf = safe(2);
  eyebrow(sf, "THE UNRETIRED EARNER", t);
  headline(sf, ["Learned AI late.", "Now he teaches it."], t, { fontSize: "76px" });
  [["Basics", "$15"], ["Images & video", "$15"], ["AI marketing", "$29"]].forEach(([name, price], i) => {
    const at = t + 0.7 + i * 0.35;
    const c = el(sf, "div", "box", { left: "40px", top: px(310 + i * 170), width: "880px", height: "140px", gap: "30px", padding: "0 40px" });
    el(c, "div", "pill mono", { position: "relative", flex: "none", width: "92px", height: "56px", background: "rgba(99,102,241,0.18)", border: "3px solid #6366f1", color: "#a5b4fc", fontSize: "30px" }, "AI");
    el(c, "div", "", { flex: "1", fontSize: "44px", fontWeight: 800 }, name);
    el(c, "div", "num", { fontSize: "56px", fontWeight: 900, color: "#22c55e" }, price);
    tl.fromTo($(c), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, at);
  });
  const tl8 = el(sf, "div", "ab", { left: "0px", top: "860px", width: "960px", textAlign: "center", fontSize: "110px", fontWeight: 900, color: "#8a8aa0", letterSpacing: "-2px" }, "TOO LATE?");
  allow(tl8);
  pop($(tl8), t + 2.2, 0.8);
  const ss = svgBox(sf, 0, 860, 960, 140);
  const strike = svgEl(ss, "path", { d: "M 170 80 L 790 62", stroke: "#22c55e", "stroke-width": 14, pathLength: 1, class: "draw" });
  allow(ss);
  drawIn($(strike), t + 3.1, 0.45);
  tl.to($(tl8), { opacity: 0.5, duration: 0.3 }, t + 3.4);
  bodyText(sf, "He remembers exactly<br><b>where he got stuck.</b>", 1080, t + 3.9);
}

// ---------------- Scene 3: two steps behind ----------------
{
  const t = S[2], sf = safe(3);
  eyebrow(sf, "TWO STEPS BEHIND", t);
  headline(sf, ["Someone's two steps", "behind you."], t, { fontSize: "76px" });
  const s = svgBox(sf, 0, 340, 960, 640);
  const stairs = svgEl(s, "path", { d: "M 40 600 L 210 600 L 210 490 L 380 490 L 380 380 L 550 380 L 550 270 L 720 270 L 720 160 L 920 160", stroke: "#3a3a52", "stroke-width": 10, pathLength: 1, class: "draw" });
  drawIn($(stairs), t + 0.6, 1.2);
  // highlight the two steps between them and you
  const gap = svgEl(s, "path", { d: "M 465 380 L 550 380 L 550 270 L 720 270 L 720 160 L 820 160", stroke: "#6366f1", "stroke-width": 10, pathLength: 1, class: "draw" });
  drawIn($(gap), t + 2.6, 0.8);
  const you = svgEl(s, "circle", { cx: 820, cy: 122, r: 32, fill: "#22c55e" });
  const them = svgEl(s, "circle", { cx: 465, cy: 346, r: 28, fill: "#6366f1" });
  pop($(you), t + 1.7, 0.3);
  pop($(them), t + 2.1, 0.3);
  label(sf, 700, 340 + 30, 240, "YOU", "#22c55e", t + 1.8);
  label(sf, 300, 340 + 250, 330, "SOMEONE", "#a5b4fc", t + 2.2);
  const n1 = el(sf, "div", "ab mono", { left: "560px", top: px(340 + 290), width: "160px", textAlign: "center", fontSize: "30px", fontWeight: 700, color: "#a5b4fc" }, "STEP 1");
  const n2 = el(sf, "div", "ab mono", { left: "730px", top: px(340 + 180), width: "160px", textAlign: "center", fontSize: "30px", fontWeight: 700, color: "#a5b4fc" }, "STEP 2");
  rise($(n1), t + 2.9, 12, 0.4); rise($(n2), t + 3.2, 12, 0.4);
  bodyText(sf, "They'll pay to skip the steps<br><b>you already climbed.</b>", 1040, t + 4.0);
}

// ---------------- Scene 4: who pays + math ----------------
{
  const t = S[3], sf = safe(4);
  eyebrow(sf, "WHO'S PAYING", t);
  headline(sf, ["You have a version", "of this."], t, { fontSize: "76px" });
  const rows = [["Sorted an estate alone", "Families facing it next"], ["Moved abroad on Social Security", "Couples planning the move"], ["Kept the books 30 years", "Shop owners vs QuickBooks"]];
  const hdr = el(sf, "div", "ab mono", { left: "0px", top: "290px", width: "960px", display: "flex", justifyContent: "space-between", fontSize: "28px", fontWeight: 700, color: "#a3a3b8", letterSpacing: "2px" });
  ["WHAT YOU DID", "WHO PAYS"].forEach((h) => el(hdr, "div", "", { width: "430px", textAlign: "center" }, h));
  rise($(hdr), t + 0.4, 12, 0.4);
  const s = svgBox(sf, 0, 340, 960, 420);
  rows.forEach((r, i) => {
    const y = 345 + i * 135, at = t + 0.6 + i * 0.35;
    const cols = [["#14142a", "#3a3a52", "#ffffff"], ["rgba(34,197,94,0.14)", "#22c55e", "#22c55e"]];
    r.forEach((txt, k) => {
      const c = el(sf, "div", "pill", { left: px(k * 530), top: px(y), width: "430px", height: "112px", padding: "0 22px", background: cols[k][0], border: "4px solid " + cols[k][1], color: cols[k][2], fontSize: "30px", lineHeight: 1.15, borderRadius: "22px" }, txt);
      tl.fromTo($(c), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, at + k * 0.15);
    });
    const ax = 450, yy = y - 340 + 56;
    const a = svgEl(s, "path", { d: "M " + ax + " " + yy + " L " + (ax + 58) + " " + yy + " M " + (ax + 44) + " " + (yy - 14) + " L " + (ax + 58) + " " + yy + " L " + (ax + 44) + " " + (yy + 14), stroke: "#6366f1", "stroke-width": 6, pathLength: 1, class: "draw" });
    drawIn($(a), at + 0.15, 0.25);
  });
  const f = el(sf, "div", "ab", { left: "0px", top: "800px", width: "960px", textAlign: "center", fontSize: "44px", fontWeight: 700, color: "#ffffff" }, "$29 class × 40 buyers × 12 months");
  rise($(f), t + 2.0, 16, 0.5);
  const n = el(sf, "div", "ab num", { left: "0px", top: "880px", width: "960px", textAlign: "center", fontSize: "150px", fontWeight: 900, color: "#22c55e", lineHeight: 1.1 }, "$0");
  rise($(n), t + 2.4, 20, 0.4);
  const c = { v: 0 };
  tl.fromTo(c, { v: 0 }, { v: 13920, duration: 1.5, ease: "power2.out", onUpdate: () => (n.textContent = "$" + fmt(c.v)) }, t + 2.5);
  const y = el(sf, "div", "ab", { left: "0px", top: "1065px", width: "960px", textAlign: "center", fontSize: "36px", fontWeight: 700, color: "#a3a3b8" }, "a year. Example math, not a promise.");
  rise($(y), t + 3.4, 12, 0.4);
}
// ---------------- Scene 5: CTA ----------------
{
  const t = S[4], sf = safe(5);
  let seed = 4242;
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  const field = document.getElementById("particles");
  for (let i = 0; i < 12; i++) {
    const size = 10 + rnd() * 22;
    const p = el(field, "div", "particle", { width: px(size), height: px(size), left: px(rnd() * 1040), top: px(700 + rnd() * 1300), background: rnd() > 0.5 ? "#6366f1" : "#ffffff" });
    const o = 0.08 + rnd() * 0.18;
    tl.fromTo($(p), { y: 0, opacity: 0 }, { y: -(700 + rnd() * 700), opacity: o, duration: LEN[4], ease: "none" }, t);
  }
  const wrap = el(sf, "div", "shot-wrap");
  const ring = svgEl(wrap, "svg", { viewBox: "0 0 440 440", width: 440, height: 440 });
  Object.assign(ring.style, { position: "absolute", left: "0px", top: "0px" });
  svgEl(ring, "circle", { cx: 220, cy: 220, r: 212, fill: "none", stroke: "#6366f1", "stroke-width": 4, "stroke-dasharray": "44 18", "stroke-linecap": "round" });
  const shot = el(wrap, "div", "shot");
  const img = document.createElement("img");
  img.src = "ow-headshot-bw.png";
  img.alt = "";
  shot.appendChild(img);
  tl.fromTo($(wrap), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: E }, t + 0.3);
  tl.fromTo($(ring), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 60, duration: 5.4, ease: "none" }, t + 0.3);
  headline(sf, ["What did you figure", "out after 60?"], t + 0.5, { top: "660px", fontSize: "76px" });
  bodyText(sf, "Comment below.<br><b>I'll tell you who's two steps behind you.</b>", 880, t + 1.6);
  const tagl = el(sf, "div", "ab mono", { left: "0px", top: "1110px", width: "960px", textAlign: "center", fontSize: "30px", fontWeight: 700, color: "#a5b4fc", letterSpacing: "3px" }, "THE UNRETIRED EARNER");
  rise($(tagl), t + 2.4, 12, 0.4);
}

window.__timelines["main"] = tl;
tl.seek(0);
    </script>
  </body>
</html>
