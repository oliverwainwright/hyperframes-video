<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
  :root { --bg:#0a0a0a; --fg:#ffffff; --dim:#a3a3b8; --accent:#6366f1; --accent-hi:#a5b4fc; --success:#22c55e; --amber:#f59e0b; --red:#ef4444; --panel:#111118; --line:#26263a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
  #root { position:relative; width:100%; height:100%; background:var(--bg); color:var(--fg); font-family:"Inter", sans-serif; }
  .mono { font-family:"JetBrains Mono", monospace; }
  .scene { position:absolute; inset:0; width:100%; height:100%; }
  .si { position:absolute; inset:0; }
  /* Safe zone: top 150, bottom 170, sides 60 -> 960 x 1600 */
  .safe { position:absolute; left:60px; top:150px; width:960px; height:1600px; }
  .glow { position:absolute; width:1100px; height:1100px; left:-10px; top:380px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,0.22) 0%, rgba(99,102,241,0) 65%); }
  .ab { position:absolute; }
  .eyebrow { position:absolute; left:0; top:0; width:960px; display:flex; justify-content:center; }
  .eyebrow span { padding:8px 24px; border-radius:999px; border:3px solid var(--accent); background:rgba(99,102,241,0.16); color:var(--accent-hi); font-size:30px; font-weight:700; letter-spacing:3px; }
  .headline { position:absolute; left:0; top:70px; width:960px; text-align:center; font-weight:900; font-size:80px; line-height:1.04; letter-spacing:-2.5px; }
  .headline .l { display:block; white-space:nowrap; }
  .headline .a { color:var(--accent); }
  .body { position:absolute; left:40px; width:880px; text-align:center; font-size:42px; color:var(--dim); line-height:1.3; }
  .body b { color:#fff; font-weight:800; }
  .draw { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; }
  .pill { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:999px; font-weight:700; }
  .box { position:absolute; display:flex; align-items:center; border-radius:26px; background:var(--panel); border:4px solid var(--line); }
  .particle { position:absolute; border-radius:50%; }
  .shot-wrap { position:absolute; left:260px; top:160px; width:440px; height:440px; }
  .shot { position:absolute; left:30px; top:30px; width:380px; height:380px; border-radius:50%; overflow:hidden; border:5px solid var(--accent); box-shadow:0 30px 80px rgba(99,102,241,0.4), 0 0 0 10px var(--bg); }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { font-variant-numeric:tabular-nums; }
  .stamp { position:absolute; padding:10px 26px; border:7px solid #8a8aa0; border-radius:14px; color:#8a8aa0; font-family:"JetBrains Mono", monospace; font-weight:700; font-size:54px; letter-spacing:6px; }
</style>
  </head>
  <body>
    <div data-hf-id="hf-coex" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div data-hf-id="hf-u0u2" id="s1" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div data-hf-id="hf-f5um" class="si" id="s1-in"><div data-hf-id="hf-fssp" class="glow" id="s1-glow"></div><div data-hf-id="hf-oqr1" class="safe" id="s1-safe"></div></div>
      </div>
      <div data-hf-id="hf-15m9" id="s2" class="scene clip" data-start="5.6" data-duration="6.8" data-track-index="1">
        <div data-hf-id="hf-686n" class="si" id="s2-in"><div data-hf-id="hf-c6p0" class="glow" id="s2-glow"></div><div data-hf-id="hf-y250" class="safe" id="s2-safe"></div></div>
      </div>
      <div data-hf-id="hf-zmmd" id="s3" class="scene clip" data-start="12" data-duration="7.3" data-track-index="2">
        <div data-hf-id="hf-4w4k" class="si" id="s3-in"><div data-hf-id="hf-2wxn" class="glow" id="s3-glow"></div><div data-hf-id="hf-b4nv" class="safe" id="s3-safe"></div></div>
      </div>
      <div data-hf-id="hf-wqpn" id="s4" class="scene clip" data-start="18.9" data-duration="5.8" data-track-index="3">
        <div data-hf-id="hf-imz1" class="si" id="s4-in"><div data-hf-id="hf-fgfi" class="glow" id="s4-glow"></div><div data-hf-id="hf-k4oa" class="safe" id="s4-safe"></div></div>
      </div>
      <div data-hf-id="hf-jy65" id="s5" class="scene clip" data-start="24.3" data-duration="5.7" data-track-index="4">
        <div data-hf-id="hf-ssje" class="si" id="s5-in"><div data-hf-id="hf-ltbp" class="glow" id="s5-glow"></div><div data-hf-id="hf-x682" id="particles"></div><div data-hf-id="hf-dl5d" class="safe" id="s5-safe"></div></div>
      </div>
      <audio data-hf-id="hf-4u5e" id="bgm" src="technological-progress.mp3" data-start="0" data-duration="30" data-track-index="9" data-volume="0.35" data-fade-in="0.4" data-fade-out="0.6"></audio>
    </div>
    <script>
const tl = gsap.timeline({ paused: true });
const S = [0, 5.6, 12, 18.9, 24.3];
const LEN = [6, 6.8, 7.3, 5.8, 5.7];
const XF = 0.4;
const E = "power3.out";
const SVGNS = "http://www.w3.org/2000/svg";
const rise = (sel, at, y = 40, d = 0.6) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: E }, at);
const pop = (sel, at, from = 0.6) => tl.fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, at);
const drawIn = (sel, at, d = 0.6, stagger = 0) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out", stagger }, at);

let uid = 0;
const el = (parent, tag, cls, css = {}, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  n.id = "e" + ++uid;
  Object.assign(n.style, css);
  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
};
const svgEl = (parent, tag, attrs) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (!n.id) n.id = "e" + ++uid;
  parent.appendChild(n);
  return n;
};
const svgBox = (parent, x, y, w, h) => {
  const s = svgEl(parent, "svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h });
  Object.assign(s.style, { position: "absolute", left: x + "px", top: y + "px", overflow: "visible" });
  return s;
};
const px = (v) => v + "px";
const $ = (n) => "#" + n.id;
const fmt = (v) => Math.round(v).toLocaleString("en-US");
const safe = (i) => document.getElementById("s" + i + "-safe");

const eyebrow = (sf, text, t, now) => {
  const e = el(sf, "div", "eyebrow");
  el(e, "span", "mono", {}, text);
  if (!now) rise($(e), t + 0.2, 16, 0.4);
};
const headline = (sf, lines, t, css = {}, now) => {
  const h = el(sf, "div", "headline", css);
  el(h, "span", "l", {}, lines[0]);
  el(h, "span", "l a", {}, lines[1]);
  if (now) tl.fromTo($(h), { scale: 1.06 }, { scale: 1, duration: 1.2, ease: E }, t);
  else rise($(h), t + 0.3);
  return h;
};
const bodyText = (sf, html, top, t) => {
  const b = el(sf, "div", "body", { top: px(top) });
  b.innerHTML = html;
  rise($(b), t, 20);
};

// Crossfades + glow breath
for (let i = 1; i < 5; i++) {
  tl.to("#s" + i + "-in", { opacity: 0, duration: XF, ease: "power2.inOut" }, S[i]);
  tl.fromTo("#s" + (i + 1) + "-in", { opacity: 0 }, { opacity: 1, duration: XF, ease: "power2.inOut" }, S[i]);
}
for (let i = 1; i <= 5; i++) {
  tl.fromTo("#s" + i + "-glow", { scale: 0.92 }, { scale: 1.08, duration: LEN[i - 1] / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, S[i - 1]);
}

// ---------------- Scene 1: hook (on screen from frame 0) ----------------
{
  const t = S[0], sf = safe(1);
  eyebrow(sf, "THE UNRETIRED EARNER", t, true);
  headline(sf, ["Too boring", "to sell?"], t, {}, true);
  // document
  const s = svgBox(sf, 90, 380, 380, 480);
  const doc = svgEl(s, "path", { d: "M 20 14 L 270 14 L 360 104 L 360 466 L 20 466 Z", fill: "#111118", stroke: "#3a3a52", "stroke-width": 8, pathLength: 1, class: "draw" });
  drawIn($(doc), t + 0.2, 0.8);
  [[70, 300], [70, 300], [70, 300], [70, 240], [70, 300], [70, 200]].forEach(([x1, x2], i) => {
    const ln = svgEl(s, "path", { d: "M " + x1 + " " + (150 + i * 50) + " L " + x2 + " " + (150 + i * 50), stroke: "#33334d", "stroke-width": 12, pathLength: 1, class: "draw" });
    drawIn($(ln), t + 0.5 + i * 0.08, 0.35);
  });
  const st = el(sf, "div", "stamp", { left: "120px", top: "580px" }, "BORING");
  tl.fromTo($(st), { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -14, duration: 0.3, ease: "power4.in" }, t + 1.1);
  // price tag
  const tag = el(sf, "div", "box", { left: "500px", top: "470px", width: "420px", height: "300px", flexDirection: "column", justifyContent: "center", borderColor: "#22c55e", background: "rgba(34,197,94,0.10)", boxShadow: "0 0 70px rgba(34,197,94,0.35)" });
  const n = el(tag, "div", "num", { fontSize: "130px", fontWeight: 900, color: "#22c55e", lineHeight: 1 }, "$0");
  el(tag, "div", "", { fontSize: "40px", fontWeight: 700, color: "#ffffff", marginTop: "10px" }, "per hour");
  tl.fromTo($(tag), { opacity: 0, x: 80, rotation: 6 }, { opacity: 1, x: 0, rotation: 3, duration: 0.5, ease: E }, t + 2.0);
  const c = { v: 0 };
  tl.fromTo(c, { v: 0 }, { v: 200, duration: 1.2, ease: "power2.out", onUpdate: () => (n.textContent = "$" + Math.round(c.v)) }, t + 2.2);
  bodyText(sf, "Someone will pay <b>$200 an hour</b><br>to stop struggling with it.", 940, t + 3.0);
}

// ---------------- Scene 2: you call it Tuesday ----------------
{
  const t = S[1], sf = safe(2);
  eyebrow(sf, "SKILLS YOU STOPPED NOTICING", t);
  headline(sf, ["You call it", "Tuesday."], t);
  const items = [
    ["Spot the bad clause", (s) => [
      svgEl(s, "path", { d: "M 14 8 L 60 8 L 82 30 L 82 92 L 14 92 Z", stroke: "#a5b4fc", "stroke-width": 6, pathLength: 1, class: "draw" }),
      svgEl(s, "path", { d: "M 30 40 L 66 40 M 30 58 L 66 58 M 30 76 L 52 76", stroke: "#a5b4fc", "stroke-width": 6, pathLength: 1, class: "draw" }),
    ]],
    ["Fix the messy spreadsheet", (s) => [
      svgEl(s, "rect", { x: 8, y: 12, width: 84, height: 76, rx: 8, stroke: "#22c55e", "stroke-width": 6, pathLength: 1, class: "draw" }),
      svgEl(s, "path", { d: "M 8 38 L 92 38 M 8 63 L 92 63 M 36 12 L 36 88 M 64 12 L 64 88", stroke: "#22c55e", "stroke-width": 5, pathLength: 1, class: "draw" }),
    ]],
    ["Calm the angry customer", (s) => [
      svgEl(s, "path", { d: "M 12 20 Q 12 10 22 10 L 80 10 Q 90 10 90 20 L 90 62 Q 90 72 80 72 L 40 72 L 22 90 L 24 72 L 22 72 Q 12 72 12 62 Z", stroke: "#f59e0b", "stroke-width": 6, pathLength: 1, class: "draw" }),
      svgEl(s, "path", { d: "M 28 42 L 38 32 L 48 48 L 58 32 L 68 48 L 76 38", stroke: "#f59e0b", "stroke-width": 6, pathLength: 1, class: "draw" }),
    ]],
  ];
  items.forEach(([txt, icon], i) => {
    const at = t + 0.7 + i * 1.3;
    const bx = el(sf, "div", "box", { left: "0px", top: px(330 + i * 200), width: "960px", height: "164px", gap: "34px", padding: "0 44px" });
    const ic = el(bx, "div", "", { flex: "none", width: "100px", height: "100px", position: "relative" });
    const s = svgBox(ic, 0, 0, 100, 100);
    const paths = icon(s);
    el(bx, "div", "", { fontSize: "44px", fontWeight: 800, lineHeight: 1.15 }, txt);
    tl.fromTo($(bx), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, at);
    paths.forEach((p, k) => drawIn($(p), at + 0.2 + k * 0.25, 0.5));
  });
  // calendar page
  const cal = el(sf, "div", "ab", { left: "330px", top: "950px", width: "300px", height: "150px", borderRadius: "20px", background: "#ffffff", overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" });
  el(cal, "div", "", { height: "50px", background: "#6366f1" });
  el(cal, "div", "mono", { height: "100px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "44px", fontWeight: 700, color: "#0a0a0a", letterSpacing: "3px" }, "TUESDAY");
  tl.fromTo($(cal), { opacity: 0, rotationX: -90, transformPerspective: 800, transformOrigin: "50% 0%" }, { opacity: 1, rotationX: 0, transformPerspective: 800, transformOrigin: "50% 0%", duration: 0.7, ease: E }, t + 5.0);
}

// ---------------- Scene 3: curse of knowledge ----------------
{
  const t = S[2], sf = safe(3);
  eyebrow(sf, "WHY YOU CAN'T SEE IT", t);
  headline(sf, ["The curse", "of knowledge."], t);
  const s = svgBox(sf, 0, 300, 960, 700);
  // staircase rising to the right: steps at x 80..880
  const stairs = svgEl(s, "path", { d: "M 60 640 L 60 540 L 260 540 L 260 440 L 460 440 L 460 340 L 660 340 L 660 240 L 900 240 L 900 640 Z", fill: "rgba(99,102,241,0.08)", stroke: "#6366f1", "stroke-width": 8, pathLength: 1, class: "draw" });
  tl.fromTo($(stairs), { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.6, ease: "power2.out" }, t + 1.4);
  drawIn($(stairs), t + 0.6, 1.0);
  // YOU on top step
  const you = el(sf, "div", "pill", { left: "690px", top: "430px", width: "180px", height: "100px", background: "#22c55e", color: "#0a0a0a", fontSize: "44px", fontWeight: 900 }, "YOU");
  pop($(you), t + 1.5, 0.5);
  // them one step below, with a question mark
  const q = el(sf, "div", "pill", { left: "500px", top: "520px", width: "120px", height: "120px", background: "#14142a", border: "5px solid #f59e0b", color: "#f59e0b", fontSize: "70px", fontWeight: 900 }, "?");
  pop($(q), t + 2.0, 0.5);
  tl.to($(q), { scale: 1.12, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 5 }, t + 2.6);
  const lab = el(sf, "div", "ab", { left: "120px", top: "555px", width: "360px", textAlign: "right", fontSize: "34px", fontWeight: 700, color: "#f59e0b" }, "stuck here tonight");
  rise($(lab), t + 2.4, 12, 0.4);
  // arrow from YOU down to them
  const arr = svgEl(s, "path", { d: "M 740 120 C 700 40, 600 60, 570 180 M 548 156 L 570 182 L 594 158", stroke: "#a5b4fc", "stroke-width": 6, pathLength: 1, class: "draw" });
  drawIn($(arr), t + 2.8, 0.7);
  const ob = el(sf, "div", "ab", { left: "380px", top: "290px", width: "300px", textAlign: "center", fontSize: "32px", fontWeight: 700, color: "#a5b4fc" }, "\"obvious\"");
  rise($(ob), t + 3.2, 12, 0.4);
  bodyText(sf, "You forget what it felt like<br><b>not to know it.</b>", 1040, t + 3.8);
}

// ---------------- Scene 4: who pays + math ----------------
{
  const t = S[3], sf = safe(4);
  headline(sf, ["Boring to you.", "Priceless to them."], t, { top: "0px", fontSize: "76px" });
  const rows = [["Contracts", "Bakery owner", "Lease review"], ["Spreadsheets", "Plumbing co.", "Cleanup"], ["Angry customers", "Support team", "Training"]];
  const hdr = el(sf, "div", "ab mono", { left: "0px", top: "220px", width: "960px", display: "flex", fontSize: "28px", fontWeight: 700, color: "#a3a3b8", letterSpacing: "2px" });
  ["SKILL", "WHO PAYS", "OFFER"].forEach((h) => el(hdr, "div", "", { width: "320px", textAlign: "center" }, h));
  rise($(hdr), t + 0.4, 12, 0.4);
  const s = svgBox(sf, 0, 270, 960, 420);
  rows.forEach((r, i) => {
    const y = 280 + i * 130, at = t + 0.6 + i * 0.35;
    const cols = [["#14142a", "#3a3a52", "#ffffff"], ["#14142a", "#6366f1", "#a5b4fc"], ["rgba(34,197,94,0.14)", "#22c55e", "#22c55e"]];
    r.forEach((txt, k) => {
      const c = el(sf, "div", "pill", { left: px(k * 330), top: px(y), width: "290px", height: "96px", background: cols[k][0], border: "4px solid " + cols[k][1], color: cols[k][2], fontSize: "30px", borderRadius: "22px" }, txt);
      tl.fromTo($(c), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: E }, at + k * 0.15);
      if (k < 2) {
        const ax = 290 + k * 330 + 6, yy = y - 270 + 48;
        const a = svgEl(s, "path", { d: "M " + ax + " " + yy + " L " + (ax + 26) + " " + yy + " M " + (ax + 16) + " " + (yy - 10) + " L " + (ax + 26) + " " + yy + " L " + (ax + 16) + " " + (yy + 10), stroke: "#6366f1", "stroke-width": 5, pathLength: 1, class: "draw" });
        drawIn($(a), at + 0.15 + k * 0.15, 0.25);
      }
    });
  });
  const f = el(sf, "div", "ab", { left: "0px", top: "720px", width: "960px", textAlign: "center", fontSize: "44px", fontWeight: 700, color: "#ffffff" }, "4 hrs/week × $200 × 48 weeks");
  rise($(f), t + 2.0, 16, 0.5);
  const n = el(sf, "div", "ab num", { left: "0px", top: "800px", width: "960px", textAlign: "center", fontSize: "150px", fontWeight: 900, color: "#22c55e", lineHeight: 1.1 }, "$0");
  rise($(n), t + 2.4, 20, 0.4);
  const c = { v: 0 };
  tl.fromTo(c, { v: 0 }, { v: 38400, duration: 1.5, ease: "power2.out", onUpdate: () => (n.textContent = "$" + fmt(c.v)) }, t + 2.5);
  const y = el(sf, "div", "ab", { left: "0px", top: "985px", width: "960px", textAlign: "center", fontSize: "36px", fontWeight: 700, color: "#a3a3b8" }, "a year. Example math, not a promise.");
  rise($(y), t + 3.4, 12, 0.4);
}

// ---------------- Scene 5: CTA ----------------
{
  const t = S[4], sf = safe(5);
  let seed = 4242;
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  const field = document.getElementById("particles");
  for (let i = 0; i < 12; i++) {
    const size = 10 + rnd() * 22;
    const p = el(field, "div", "particle", { width: px(size), height: px(size), left: px(rnd() * 1040), top: px(700 + rnd() * 1300), background: rnd() > 0.5 ? "#6366f1" : "#ffffff" });
    const o = 0.08 + rnd() * 0.18;
    tl.fromTo($(p), { y: 0, opacity: 0 }, { y: -(700 + rnd() * 700), opacity: o, duration: LEN[4], ease: "none" }, t);
  }
  const wrap = el(sf, "div", "shot-wrap");
  const ring = svgEl(wrap, "svg", { viewBox: "0 0 440 440", width: 440, height: 440 });
  Object.assign(ring.style, { position: "absolute", left: "0px", top: "0px" });
  svgEl(ring, "circle", { cx: 220, cy: 220, r: 212, fill: "none", stroke: "#6366f1", "stroke-width": 4, "stroke-dasharray": "44 18", "stroke-linecap": "round" });
  const shot = el(wrap, "div", "shot");
  const img = document.createElement("img");
  img.src = "ow-headshot-bw.png";
  img.alt = "";
  shot.appendChild(img);
  tl.fromTo($(wrap), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: E }, t + 0.3);
  tl.fromTo($(ring), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 60, duration: 5.4, ease: "none" }, t + 0.3);
  headline(sf, ["What's your", "boring skill?"], t + 0.5, { top: "660px", fontSize: "84px" });
  bodyText(sf, "Comment below.<br><b>I'll tell you who's paying for it.</b>", 880, t + 1.6);
  const tagl = el(sf, "div", "ab mono", { left: "0px", top: "1060px", width: "960px", textAlign: "center", fontSize: "30px", fontWeight: 700, color: "#a5b4fc", letterSpacing: "3px" }, "THE UNRETIRED EARNER");
  rise($(tagl), t + 2.4, 12, 0.4);
}

window.__timelines["main"] = tl;
tl.seek(0);
    </script>
  </body>
</html>
